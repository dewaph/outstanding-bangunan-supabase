<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUTSTANDING SIP BANGUNAN 2026</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
<meta name="description" content="Catat barang masuk gudang bangunan dan kirim pesan WhatsApp ke pengawas.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIP Gudang">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ULTRA-MODERN ENTERPRISE SAAS DASHBOARD UI ===== */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Light Mode Palette */
  --bg: #f1f5f9;
  --bg-grad: radial-gradient(ellipse at 50% -10%, rgba(79, 70, 229, 0.08), transparent 60%);
  --nav-bg: rgba(255, 255, 255, 0.85);
  --card: #ffffff;
  --card-sub: #f8fafc;
  --ink: #0f172a;
  --ink-sec: #334155;
  --mut: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;

  /* Brand & Semantic Accents */
  --acc: #4f46e5;
  --acc-hover: #4338ca;
  --acc-soft: rgba(79, 70, 229, 0.1);
  --accink: #ffffff;

  --wa: #10b981;
  --wa-hover: #059669;
  --wa-soft: rgba(16, 185, 129, 0.12);

  --warn: #d97706;
  --warn-soft: rgba(245, 158, 11, 0.14);

  --ok: #059669;
  --ok-soft: rgba(16, 185, 129, 0.14);

  --red: #e11d48;
  --red-soft: rgba(225, 29, 72, 0.1);

  --hl: #f1f5f9;
  --inp: #ffffff;

  /* Row-Card Full Background Coloring (Light Mode) */
  --belum-bg: #ffffff;
  --belum-border: #cbd5e1;
  --belum-stripe: #64748b;

  --sebagian-bg: #fffbeb;
  --sebagian-border: #fcd34d;
  --sebagian-stripe: #f59e0b;
  --sebagian-sub: rgba(245, 158, 11, 0.1);

  --selesai-bg: #ecfdf5;
  --selesai-border: #6ee7b7;
  --selesai-stripe: #10b981;
  --selesai-sub: rgba(16, 185, 129, 0.1);

  /* Elevations & Radius */
  --sh-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --sh-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.05), 0 1px 3px -1px rgba(15, 23, 42, 0.03);
  --sh-md: 0 8px 20px -4px rgba(15, 23, 42, 0.07), 0 3px 6px -3px rgba(15, 23, 42, 0.04);
  --sh-lg: 0 20px 35px -8px rgba(15, 23, 42, 0.14), 0 8px 14px -6px rgba(15, 23, 42, 0.06);

  --rad-lg: 16px;
  --rad: 12px;
  --rad-sm: 8px;
}

html {
  scroll-padding-top: 84px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #090d16;
    --bg-grad: radial-gradient(ellipse at 50% -10%, rgba(99, 102, 241, 0.14), transparent 60%);
    --nav-bg: rgba(15, 23, 42, 0.82);
    --card: #111827;
    --card-sub: #1e293b;
    --ink: #f8fafc;
    --ink-sec: #cbd5e1;
    --mut: #94a3b8;
    --line: #1e293b;
    --line-strong: #334155;

    --acc: #6366f1;
    --acc-hover: #818cf8;
    --acc-soft: rgba(99, 102, 241, 0.18);
    --accink: #ffffff;

    --wa: #10b981;
    --wa-hover: #34d399;
    --wa-soft: rgba(16, 185, 129, 0.18);

    --warn: #fbbf24;
    --warn-soft: rgba(245, 158, 11, 0.18);

    --ok: #34d399;
    --ok-soft: rgba(16, 185, 129, 0.18);

    --red: #fb7185;
    --red-soft: rgba(244, 63, 94, 0.18);

    --hl: #1e293b;
    --inp: #0f172a;

    /* Row-Card Full Background Coloring (Dark Mode) */
    --belum-bg: #1e293b;
    --belum-border: #334155;
    --belum-stripe: #64748b;

    --sebagian-bg: rgba(245, 158, 11, 0.14);
    --sebagian-border: rgba(245, 158, 11, 0.4);
    --sebagian-stripe: #f59e0b;
    --sebagian-sub: rgba(245, 158, 11, 0.12);

    --selesai-bg: rgba(16, 185, 129, 0.14);
    --selesai-border: rgba(16, 185, 129, 0.4);
    --selesai-stripe: #10b981;
    --selesai-sub: rgba(16, 185, 129, 0.12);

    --sh-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
    --sh-sm: 0 2px 6px -1px rgba(0, 0, 0, 0.45);
    --sh-md: 0 10px 24px -4px rgba(0, 0, 0, 0.55);
    --sh-lg: 0 24px 48px -10px rgba(0, 0, 0, 0.7);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090d16;
  --bg-grad: radial-gradient(ellipse at 50% -10%, rgba(99, 102, 241, 0.14), transparent 60%);
  --nav-bg: rgba(15, 23, 42, 0.82);
  --card: #111827;
  --card-sub: #1e293b;
  --ink: #f8fafc;
  --ink-sec: #cbd5e1;
  --mut: #94a3b8;
  --line: #1e293b;
  --line-strong: #334155;

  --acc: #6366f1;
  --acc-hover: #818cf8;
  --acc-soft: rgba(99, 102, 241, 0.18);
  --accink: #ffffff;

  --wa: #10b981;
  --wa-hover: #34d399;
  --wa-soft: rgba(16, 185, 129, 0.18);

  --warn: #fbbf24;
  --warn-soft: rgba(245, 158, 11, 0.18);

  --ok: #34d399;
  --ok-soft: rgba(16, 185, 129, 0.18);

  --red: #fb7185;
  --red-soft: rgba(244, 63, 94, 0.18);

  --hl: #1e293b;
  --inp: #0f172a;

  /* Row-Card Full Background Coloring (Dark Mode) */
  --belum-bg: #1e293b;
  --belum-border: #334155;
  --belum-stripe: #64748b;

  --sebagian-bg: rgba(245, 158, 11, 0.14);
  --sebagian-border: rgba(245, 158, 11, 0.4);
  --sebagian-stripe: #f59e0b;
  --sebagian-sub: rgba(245, 158, 11, 0.12);

  --selesai-bg: rgba(16, 185, 129, 0.14);
  --selesai-border: rgba(16, 185, 129, 0.4);
  --selesai-stripe: #10b981;
  --selesai-sub: rgba(16, 185, 129, 0.12);

  --sh-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-sm: 0 2px 6px -1px rgba(0, 0, 0, 0.45);
  --sh-md: 0 10px 24px -4px rgba(0, 0, 0, 0.55);
  --sh-lg: 0 24px 48px -10px rgba(0, 0, 0, 0.7);
}

*, *::before, *::after {
  box-sizing: inherit;
}

body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--ink);
  font: 14px/1.5 var(--font-sans);
  font-variant-numeric: tabular-nums;
  overflow-x: clip;
}

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 20px 48px;
  display: flex;
  flex-direction: column;
}

/* ===== TOP NAVBAR (ikut halaman, tidak menempel saat scroll) ===== */
header {
  order: 0;
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  align-items: center;
  justify-content: space-between;
  background: var(--nav-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 12px 18px;
  margin: 12px 0 22px;
  box-shadow: var(--sh-sm);
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 17.5px;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

#info {
  display: none;
}

.hact {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

#upd {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--mut);
  background: var(--card-sub);
  border: 1px solid var(--line);
  padding: 5px 11px;
  border-radius: 999px;
  font: 600 11.5px/1 var(--font-mono);
  white-space: nowrap;
}
#upd:empty {
  display: none;
}
#upd::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
  animation: pulseDot 2s infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

/* ===== BUTTONS & INPUT CONTROLS ===== */
button, .btn, select, input {
  font: inherit;
  color: var(--ink);
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

button, .btn {
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-decoration: none;
  box-shadow: var(--sh-xs);
  white-space: nowrap;
}

button:hover:not(:disabled), .btn:hover {
  background: var(--hl);
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--sh-sm);
}

button:active:not(:disabled), .btn:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.sm {
  padding: 7px 13px;
  font-size: 12.5px;
  height: 36px;
}

.primary {
  background: var(--acc);
  color: var(--accink);
  border-color: transparent;
  box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
}
.primary:hover:not(:disabled) {
  background: var(--acc-hover);
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
}

.wa, #wm {
  background: var(--wa);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
}
.wa:hover:not(:disabled), #wm:hover:not(:disabled) {
  background: var(--wa-hover);
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
}
.wa.off {
  opacity: 0.5;
}
#wm[aria-pressed="true"] {
  filter: brightness(0.92);
}

.wasent {
  background: var(--acc-soft);
  color: var(--acc);
  border-color: rgba(79, 70, 229, 0.3);
  font-weight: 600;
  box-shadow: none;
}
.wasent:hover:not(:disabled) {
  background: rgba(79, 70, 229, 0.2);
  border-color: var(--acc);
}

#dm {
  background: var(--acc);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 2px 6px rgba(79, 70, 229, 0.22);
}
#dm:hover:not(:disabled) {
  background: var(--acc-hover);
  border-color: transparent;
}
#dm[aria-pressed="true"] {
  filter: brightness(0.92);
}

#th {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 10px;
  background: var(--card-sub);
  border-color: var(--line);
}

/* Tombol tema: pojok kanan atas header */
.brand-wrap { flex: 1 1 auto; min-width: 0; }
header > #th { order: 2; flex: 0 0 auto; }
.hact { order: 1; }
@media (max-width: 960px) {
  .brand-wrap { flex: 1 1 0; }
  header > #th { order: 1; }
  .hact { order: 2; }
}

#me {
  background: var(--red-soft);
  color: var(--red);
  border-color: rgba(225, 29, 72, 0.22);
  box-shadow: none;
}
#me:hover {
  background: var(--red);
  color: #ffffff;
  border-color: var(--red);
}
#me[hidden] {
  display: none;
}

button[data-dt], button[data-rv], #clr {
  background: var(--red-soft);
  color: var(--red);
  border-color: rgba(225, 29, 72, 0.25);
  box-shadow: none;
}
button[data-dt]:hover, button[data-rv]:hover, #clr:hover {
  background: var(--red);
  color: #ffffff;
  border-color: var(--red);
}

.cnt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 19px;
  height: 19px;
  padding: 0 6px;
  border-radius: 999px;
  background: #ffffff;
  color: #059669;
  font: 800 11px/1 var(--font-mono);
}
#dm .cnt {
  color: var(--acc);
}
.cnt[hidden] {
  display: none;
}

input, select {
  background: var(--inp);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  min-width: 0;
  height: 40px;
  font-size: 13.5px;
  font-weight: 500;
}

input:focus, select:focus, :focus-visible {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-soft);
}

#msg {
  order: 1;
  background: var(--warn-soft);
  color: var(--warn);
  border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: var(--rad);
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
}
#msg:empty {
  display: none;
}

/* ===== HERO METRIC CARDS (#stats) ===== */
#stats {
  order: 2;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin: 0 0 18px;
}

.k {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 16px 18px;
  box-shadow: var(--sh-sm);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}

.k:hover {
  transform: translateY(-2px);
  box-shadow: var(--sh-md);
}

.k-ico {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: grid;
  place-items: center;
}

.k-txt {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.k b {
  font: 800 26px/1.1 var(--font-mono);
  color: var(--ink);
  letter-spacing: -0.03em;
  margin-bottom: 3px;
}

.k-lbl {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.k1 .k-ico { background: rgba(100, 116, 139, 0.12); color: #64748b; }
.k2 .k-ico { background: var(--warn-soft); color: var(--warn); }
.k2 b { color: var(--warn); }
.k3 .k-ico { background: var(--ok-soft); color: var(--ok); }
.k3 b { color: var(--ok); }
.k4 .k-ico { background: var(--acc-soft); color: var(--acc); }
.k4 b { color: var(--acc); }

/* ===== FLOATING COMMAND / FILTER BAR (.filters) ===== */
.filters {
  order: 3;
  display: grid;
  grid-template-columns: 2.2fr 1.2fr 1fr 1fr;
  gap: 10px;
  background: color-mix(in srgb, var(--card) 60%, transparent);
  backdrop-filter: blur(16px) saturate(1.6);
  -webkit-backdrop-filter: blur(16px) saturate(1.6);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 12px;
  box-shadow: var(--sh-sm), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  margin-bottom: 18px;
  align-items: center;
  position: sticky;
  top: calc(10px + env(safe-area-inset-top, 0px));
  z-index: 30;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box svg {
  position: absolute;
  left: 13px;
  width: 17px;
  height: 17px;
  color: var(--mut);
  pointer-events: none;
}

.search-box #q {
  width: 100%;
  padding-left: 38px;
  background: color-mix(in srgb, var(--card-sub) 70%, transparent);
}
.search-box #q:focus {
  background: var(--inp);
}

.filters select {
  background-color: color-mix(in srgb, var(--card-sub) 70%, transparent);
  cursor: pointer;
}

/* ===== STRUCTURED 4-ZONE HORIZONTAL ROW-CARD LAYOUT (#tb) ===== */
.tw {
  order: 4;
  border: 0;
  background: none;
  overflow: visible;
}

table, tbody {
  display: block;
  width: 100%;
  min-width: 0;
}

thead {
  display: none;
}

/* 4-Column Structured Row-Card (Desktop) */
tr:not(.ed):not(.ld) {
  display: grid;
  grid-template-columns: minmax(280px, 2.1fr) minmax(200px, 1.15fr) minmax(190px, 1.15fr) 170px;
  gap: 18px;
  align-items: stretch;
  background: var(--belum-bg);
  border: 1.5px solid var(--belum-border);
  border-left: 6px solid var(--belum-stripe);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--sh-sm);
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}

tr:not(.ed):not(.ld):hover {
  box-shadow: var(--sh-md);
}

/* Full-Card Status Background Coloring */
tr.row-sebagian {
  background: var(--sebagian-bg) !important;
  border-color: var(--sebagian-border) !important;
  border-left: 6px solid var(--sebagian-stripe) !important;
}

tr.row-selesai {
  background: var(--selesai-bg) !important;
  border-color: var(--selesai-border) !important;
  border-left: 6px solid var(--selesai-stripe) !important;
}

tr.row-selesai td, tr.row-sebagian td, .ed td {
  background: none !important;
}

td {
  display: block;
  padding: 0;
  border: 0;
  min-width: 0;
  text-align: left;
  color: var(--ink);
}

td:empty {
  display: none !important;
}

/* ZONA 1: Info Barang & Dokumen (Kiri) */
td.z-info {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  padding-right: 4px;
}

.zi-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}

.zi-pem {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 700;
  color: var(--acc);
}

.zi-tgl {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--mut);
}

.zi-tgl b {
  color: var(--ink-sec);
  font-family: var(--font-mono);
  font-weight: 600;
}

.zi-spec {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  letter-spacing: -0.01em;
  word-break: break-word;
}

.zi-docs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
  padding-top: 6px;
  border-top: 1px dashed rgba(148, 163, 184, 0.35);
  font-size: 12.5px;
  color: var(--mut);
}

.zi-doc-item {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
}

.zi-doc-item strong {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
}

.zi-ket {
  flex: 1 1 100%;
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--ink-sec);
}

.zi-ket span {
  color: var(--mut);
}

.zi-ket strong {
  color: var(--ink);
  font-weight: 600;
}

/* ZONA 2: Angka Pesanan & Progres Kedatangan Numerik (Tengah) */
td.z-num {
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: rgba(15, 23, 42, 0.035);
  border: 1px solid rgba(15, 23, 42, 0.08);
  border-radius: 10px;
  padding: 10px 14px;
}

:root[data-theme="dark"] td.z-num {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(255, 255, 255, 0.09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) td.z-num {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.09);
  }
}

tr.row-sebagian td.z-num {
  background: var(--sebagian-sub);
  border-color: rgba(245, 158, 11, 0.32);
}

tr.row-selesai td.z-num {
  background: var(--selesai-sub);
  border-color: rgba(16, 185, 129, 0.32);
}

.zn-lbl {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mut);
  margin-bottom: 3px;
}

.zn-ratio {
  font: 800 18px/1.2 var(--font-mono);
  color: var(--ink);
  margin-bottom: 6px;
}

.zn-ratio .zn-sep {
  color: var(--mut);
  font-weight: 500;
  margin: 0 2px;
}

.zn-ratio .zn-sat {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-sec);
  font-family: var(--font-sans);
}

.zn-sisa {
  font-size: 12.5px;
  font-weight: 700;
  padding-top: 5px;
  border-top: 1px solid rgba(148, 163, 184, 0.22);
  color: var(--mut);
}

.zn-sisa.kurang {
  color: var(--warn);
}

.zn-sisa.lengkap {
  color: var(--ok);
}

/* ZONA 3: Riwayat Tanggal Datang (Kanan Tengah) */
td.z-hist {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4px 12px;
  border-left: 1px solid rgba(148, 163, 184, 0.25);
}

.zh-lbl {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mut);
  margin-bottom: 6px;
}

.zh-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.zh-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font: 600 12.5px/1.3 var(--font-mono);
  color: var(--ink);
}

.zh-jml {
  color: var(--ink-sec);
  font-weight: 700;
}

.zh-empty {
  font-size: 12.5px;
  font-style: italic;
  color: var(--mut);
}

.by {
  display: inline-block;
  font: 700 10.5px/1.2 var(--font-sans);
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--acc-soft);
  color: var(--acc);
}

/* ZONA 4: Tombol Aksi (Kanan) */
td.ac {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 7px;
  padding-left: 12px;
  border-left: 1px solid rgba(148, 163, 184, 0.25);
}

td.ac .sm {
  width: 100%;
  justify-content: center;
}

/* Status Pill */
.b {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  padding: 3px 10px;
  border-radius: 999px;
}
.b::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.b.belum {
  background: var(--hl);
  color: var(--ink-sec);
  border: 1px solid var(--line-strong);
}
.b.belum::before { background: #64748b; }

.b.sebagian {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #f59e0b;
}
.b.sebagian::before { background: #f59e0b; }

.b.selesai {
  background: #d1fae5;
  color: #065f46;
  border: 1px solid #10b981;
}
.b.selesai::before { background: #10b981; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .b.sebagian {
    background: rgba(245, 158, 11, 0.22);
    color: #fcd34d;
    border-color: rgba(245, 158, 11, 0.5);
  }
  :root:not([data-theme="light"]) .b.selesai {
    background: rgba(16, 185, 129, 0.22);
    color: #6ee7b7;
    border-color: rgba(16, 185, 129, 0.5);
  }
}
:root[data-theme="dark"] .b.sebagian {
  background: rgba(245, 158, 11, 0.22);
  color: #fcd34d;
  border-color: rgba(245, 158, 11, 0.5);
}
:root[data-theme="dark"] .b.selesai {
  background: rgba(16, 185, 129, 0.22);
  color: #6ee7b7;
  border-color: rgba(16, 185, 129, 0.5);
}

td[colspan] {
  grid-column: 1 / -1;
  text-align: center;
  padding: 36px 16px;
  color: var(--mut);
  font-weight: 600;
}

/* ===== RESPONSIVE MOBILE & TABLET (2-KOLOM RAPI PADA HP) ===== */
@media (max-width: 960px) {
  .wrap {
    padding: 0 12px 36px;
  }
  header {
    padding: 12px 14px;
    margin: 8px 0 16px;
  }
  .hact {
    width: 100%;
  }
  #wm, #dm {
    flex: 1 1 auto;
  }
  #stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .k {
    padding: 13px 14px;
    gap: 11px;
  }
  .k-ico {
    width: 40px;
    height: 40px;
  }
  .k b {
    font-size: 22px;
  }
  .filters {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding: 10px;
    top: calc(8px + env(safe-area-inset-top, 0px));
  }
  .filters .search-box {
    grid-column: 1 / -1;
  }
  .filters select {
    min-width: 0;
    font-size: 12.5px;
    padding-left: 8px;
    padding-right: 18px;
    background-position: right 6px center;
    text-overflow: ellipsis;
  }
  input, select {
    font-size: 16px;
  }
  button, .btn {
    min-height: 40px;
  }
  tr:not(.ed):not(.ld) {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 14px;
  }
  td.z-info {
    grid-column: 1 / -1;
    padding-right: 0;
  }
  td.z-num {
    grid-column: 1 / 2;
  }
  td.z-hist {
    grid-column: 2 / 3;
    border-left: 0;
    background: rgba(15, 23, 42, 0.03);
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 10px;
    padding: 10px 12px;
  }
  :root[data-theme="dark"] td.z-hist {
    background: rgba(255, 255, 255, 0.03);
    border-color: rgba(255, 255, 255, 0.08);
  }
  td.ac {
    grid-column: 1 / -1;
    flex-direction: row;
    flex-wrap: wrap;
    padding-left: 0;
    padding-top: 10px;
    border-left: 0;
    border-top: 1px dashed rgba(148, 163, 184, 0.35);
  }
  td.ac .sm {
    flex: 1 1 140px;
    width: auto;
    min-height: 42px;
  }
}

@media (max-width: 480px) {
  tr:not(.ed):not(.ld) {
    grid-template-columns: 1fr;
  }
  td.z-num, td.z-hist {
    grid-column: 1 / -1;
  }
}

/* ===== PAGINATION ===== */
.pager {
  order: 5;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin: 18px 0 8px;
  color: var(--mut);
  font: 600 13px/1 var(--font-mono);
}

@media (max-width: 700px) {
  .pager button {
    flex: 1;
  }
}

/* ===== FULLSCREEN SLIDE-OVER PANELS (#panel WA & #dmp Gudang) ===== */
#panel, #dmp {
  overscroll-behavior: contain;
}

#panel:not([hidden]), #dmp:not([hidden]) {
  position: fixed;
  inset: 0;
  z-index: 42;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: var(--bg);
  overflow: auto;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow: none;
}

#dmp:not([hidden]) {
  z-index: 41;
}

#panel > *, #dmp > * {
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

#panel .ph, #dmp .ph {
  position: sticky;
  top: calc(10px + env(safe-area-inset-top, 0px));
  z-index: 5;
  display: flex;
  gap: 8px 12px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--acc);
  border-radius: var(--rad-lg);
  box-shadow: var(--sh-sm);
  margin-top: calc(10px + env(safe-area-inset-top, 0px));
  margin-bottom: 16px;
  padding: 12px 14px;
  font-size: 17px;
}

#panel .ph {
  border-left-color: var(--wa);
}

/* penutup celah di atas kotak judul agar kartu tidak terlihat lewat */
#panel .ph::before, #dmp .ph::before {
  content: "";
  position: absolute;
  left: -1px;
  right: -1px;
  top: calc(-10px - env(safe-area-inset-top, 0px));
  height: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--bg);
  z-index: -1;
}

.ph b {
  font-weight: 800;
  color: var(--ink);
  line-height: 1.3;
}

.ph span {
  color: var(--mut);
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px 10px;
  font-size: 12.5px;
  font-weight: 600;
}

.grp {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--sh-sm);
}

.gh {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.gh h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
}

.gh label {
  font-size: 13px;
  font-weight: 600;
  color: var(--mut);
  display: flex;
  gap: 8px;
  align-items: center;
}

.it {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 8px;
}

.it .n {
  width: 22px;
  font: 700 13px var(--font-mono);
  color: var(--mut);
}

.ro {
  flex: 1 1 220px;
  font-size: 13.5px;
}

.x {
  padding: 4px 10px;
  line-height: 1;
  font-size: 16px;
  color: var(--mut);
}
.x:hover {
  color: var(--red);
  border-color: var(--red);
}

.prev {
  white-space: pre-wrap;
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-left: 4px solid var(--wa);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 12px 0;
  font: 12.5px/1.6 var(--font-mono);
  color: var(--ink);
}

.act {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ===== DAFTAR MATERIAL (#dmp) ===== */
#dmp .dmf {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px auto;
}

#dmp #dmq, #dmp #dmsel, #dmp #dmwa {
  flex: 1 1 100%;
  font-size: 14.5px;
  height: 42px;
}

#dmp .dmtabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 12px auto 16px;
  padding: 5px;
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 12px;
}

#dmp .dmtabs button {
  border: 0;
  background: none;
  padding: 10px 8px;
  font-weight: 700;
  font-size: 13px;
  border-radius: 8px;
  color: var(--mut);
  box-shadow: none;
}

#dmp .dmtabs button.on {
  background: var(--card);
  color: var(--acc);
  box-shadow: var(--sh-xs);
}

#dmp > .note {
  font-size: 14px;
  text-align: center;
  padding: 36px 12px;
  color: var(--mut);
}

#dmp .grp {
  background: transparent;
  border: 0;
  padding: 0;
  box-shadow: none;
  margin-bottom: 22px;
}

#dmp .gh {
  border-bottom: 0;
  padding: 4px 2px 8px;
  margin-bottom: 6px;
}

#dmp .dmc {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--acc);
  border-radius: var(--rad-lg);
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--sh-sm);
}

#dmp .dmc.out {
  border-left-color: var(--mut);
}

#dmp .dmh {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 10px;
}

#dmp .dmnm {
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

#dmp .dmk {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 10px;
  background: var(--card-sub);
  border: 1px solid var(--line);
  padding: 10px 12px;
  border-radius: 10px;
}

#dmp .dmk small, #dmp .dmket small {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--mut);
  margin-bottom: 2px;
}

#dmp .dmk strong {
  font: 700 14.5px var(--font-mono);
}

#dmp .dmket {
  margin-bottom: 10px;
}

#dmp .dmket strong {
  font-size: 13.5px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

#dmp .dmx {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  align-items: center;
  font-size: 12.5px;
  color: var(--mut);
  margin-bottom: 10px;
}

#dmp .dmtp {
  background: var(--acc-soft);
  color: var(--acc);
  border: 1px solid rgba(79, 70, 229, 0.25);
}

#dmp .dmb {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#dmp .dmb button {
  flex: 1 1 180px;
  min-height: 40px;
}

/* ===== MODALS (.edmod & .dmmod) ===== */
.edmod, #dmp .dmmod {
  position: fixed;
  inset: 0;
  z-index: 60;
  max-width: none;
  margin: 0;
  background: rgba(9, 13, 22, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: auto;
}

.edbox, #dmp .dmbox {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  width: min(430px, 100%);
  max-height: 92vh;
  overflow: auto;
  display: grid;
  gap: 14px;
  box-shadow: var(--sh-lg);
}

.edbox h3, #dmp .dmbox h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.edbox .st {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  align-items: center;
  padding: 9px 12px;
  background: var(--card-sub);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 13px;
}

.edbox .edf {
  display: grid;
  gap: 12px;
  margin: 0;
}

.edbox .edf[hidden] {
  display: none;
}

.edbox .edf label, #dmp .dmbox label {
  display: grid;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mut);
}

.edbox .edf input, #dmp .dmbox input {
  font: 700 18px var(--font-mono);
  height: 46px;
  padding: 10px 12px;
  text-align: center;
  width: 100%;
}

.edbox button, #dmp .dmbb button {
  min-height: 44px;
  font-size: 14px;
}

#dmp .dmbb {
  display: flex;
  gap: 8px;
}

#dmp .dmbb button {
  flex: 1;
}

.note {
  font-size: 13px;
  color: var(--mut);
}

/* ===== USER PROFILE & PIN PICKER (#pick) ===== */
.pick {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  background-image: var(--bg-grad);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  overflow: auto;
}

.pick[hidden], .pk-list[hidden], .pk-pin[hidden] {
  display: none;
}

.pick h2 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.025em;
  text-align: center;
}

.pk-list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  max-width: 580px;
}

.pk-b {
  display: grid;
  gap: 12px;
  justify-items: center;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 18px;
  padding: 20px 24px;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  box-shadow: var(--sh-sm);
}

.pk-b:hover, .pk-b:focus-visible {
  transform: translateY(-4px);
  box-shadow: var(--sh-lg);
  border-color: var(--acc);
}

.pk-av {
  width: 76px;
  height: 76px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 32px;
  font-weight: 800;
  color: #ffffff;
  box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.2);
}

.pk-pin {
  display: grid;
  gap: 14px;
  justify-items: center;
  width: min(330px, 100%);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 26px 22px;
  box-shadow: var(--sh-lg);
}

.pk-pin input {
  width: 100%;
  height: 48px;
  text-align: center;
  font: 700 22px var(--font-mono);
  letter-spacing: 0.25em;
}

.pk-pin input::placeholder {
  font: 500 13.5px var(--font-sans);
  letter-spacing: 0;
}

.pk-pin .act {
  width: 100%;
}
.pk-pin .act button {
  flex: 1;
  min-height: 42px;
}

#pkmsg {
  min-height: 1.4em;
  color: var(--warn);
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
}

/* ===== BOOT SCREEN & LOADING STATES ===== */
tr.ld, tr.ld td {
  display: block;
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
}

#msg:not(:empty) ~ .tw .ld {
  display: none;
}

.ldh {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 40px 16px;
  color: var(--mut);
  font-weight: 600;
}

#boot {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  background-image: var(--bg-grad);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

#boot.done {
  opacity: 0;
  visibility: hidden;
}

.bk-box {
  display: grid;
  justify-items: center;
  gap: 16px;
  width: min(300px, 100%);
}

.bk-wall {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  width: 136px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--sh-md);
}

.bk-wall i {
  display: block;
  grid-column: span 2;
  height: 12px;
  border-radius: 4px;
  background: var(--hl);
  animation: bkcell 1.5s ease-in-out infinite;
  animation-delay: calc(var(--d) * 0.1s);
}

.bk-wall i.s { grid-column: span 1; }
.bk-wall i.h { background: var(--acc); animation: none; }

@keyframes bkcell {
  0%, 100% { background: var(--hl); opacity: 0.6; }
  50% { background: var(--acc); opacity: 1; }
}

#boot .bk-t {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.015em;
}

#boot .bk-s {
  margin: 0;
  color: var(--mut);
  font-size: 13.5px;
  font-weight: 500;
  min-height: 1.4em;
  transition: opacity 0.2s;
}

.bk-bar {
  position: relative;
  width: 100%;
  height: 5px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}

.bk-bar::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 40%;
  border-radius: 999px;
  background: var(--acc);
  animation: bkbar 1.2s ease-in-out infinite;
}

@keyframes bkbar {
  from { left: -40%; }
  to { left: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .bk-bar::after { left: 0; width: 100%; animation: none; }
  .bk-wall i { animation: none; }
}

/* ===== MOBILE: PANEL WA & PANEL MATERIAL GUDANG ===== */
@media (max-width: 700px) {
  #panel:not([hidden]), #dmp:not([hidden]) {
    padding: 0 12px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  #panel .ph, #dmp .ph {
    flex-wrap: wrap;

async function writeRow(r,stages){
  const cur=await sb('b_kedatangan?select=id,tgl,jumlah&item_id=eq.'+r.id+'&order=id'),have=r.stg||[];
  if(cur.length!==have.length||cur.some(c=>!have.find(h=>h.id===c.id&&Math.abs(h.jml-Number(c.jumlah))<1e-9&&(h.tgl||'')===(c.tgl||'')))){refresh();throw{code:'conflict'}}
  const keep=new Set(stages.filter(x=>x.id).map(x=>x.id)),del=have.filter(h=>!keep.has(h.id)),add=stages.filter(x=>!x.id);
  const chg=stages.filter(x=>x.id&&have.find(h=>h.id===x.id&&((h.tgl||'')!==(x.tgl||'')||Math.abs(h.jml-x.jml)>1e-9)));
  if(del.length)await sb('b_kedatangan?id=in.('+del.map(d=>d.id).join(',')+')',{m:'DELETE'});
  for(const c of chg)await sb('b_kedatangan?id=eq.'+c.id,{m:'PATCH',b:{tgl:c.tgl||null,jumlah:c.jml}});
  if(add.length)await sb('b_kedatangan',{m:'POST',b:add.map(x=>({item_id:r.id,tgl:x.tgl||null,jumlah:x.jml,oleh:x.by||me||null}))});
  await refreshRow(r.id);lastRev=await getRev();
}
function addSel(id,quiet){

const em=t=>{const m=$('#e-m');if(m)m.textContent=t};
async function save(id){
  const r=R.get(id),tgl=$('#e-t').value,add=num2($('#e-j').value);
  if(!isoRe.test(tgl))return em('Isi tanggal datang.');
  if(add===null||add<=0)return em('Isi jumlah datang lebih dari 0.');
  if(r.qty!==null&&r.cur+add>r.qty+1e-9)return em('Jumlah datang melebihi pesanan di tabel. Maksimal '+rnd(r.qty-r.cur)+' '+r.sat+'.');
  let st0=r.stg||[],base=r.base;if(!r.stg&&r.cur>0&&isoRe.test(r.dtg||'')){st0=[{tgl:r.dtg,jml:r.cur}];base=0}
  const stages=st0.concat({tgl,jml:add,by:me}).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
  $('#e-m').textContent='Menyimpan...';
  try{await writeRow(r,stages,base)}catch(e){return em(errMsg(e))}
  editing=null;ntSend('Barang masuk',`${r.spec}: ${add} ${r.sat}${r.spk?' (SPK '+r.spk+')':''} - oleh ${me}`);dmAdd(id,tgl,add);apply(true);addSel(id,true);
}
const num2=v=>(v===''||isNaN(Number(v)))?null:Number(v);
async function editStage(k,btn){
  const [id,i]=k.split(':').map(Number),r=R.get(id);if(!r)return;
  const vs=vst(r),base=r.stg?r.base:0,row=btn.closest('.st');
  const tgl=row.querySelector('.s-t').value,j=num2(row.querySelector('.s-j').value);
  if(!isoRe.test(tgl))return em('Isi tanggal datang.');
  if(j===null||j<=0)return em('Isi jumlah datang lebih dari 0.');
  const ns=vs.map((s,x)=>x===i?{id:s.id,tgl,jml:j,by:s.by||''}:s).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
  const tot=rnd(base+ns.reduce((s,x)=>s+x.jml,0));
  if(r.qty!==null&&tot>r.qty+1e-9)return em('Total datang melebihi pesanan di tabel. Maksimal tahap ini '+rnd(r.qty-(tot-j))+' '+r.sat+'.');
  em('Menyimpan...');
  try{await writeRow(r,ns,base)}catch(e){return em(errMsg(e))}
  editing=null;apply(true);renderPanel();
}
async function delStage(k){
  const [id,i]=k.split(':').map(Number),r=R.get(id);if(!r)return;const vs=vst(r);if(!vs.length)return;
  try{await writeRow(r,vs.filter((_,x)=>x!==i),r.stg?r.base:0)}catch(e){return em(errMsg(e))}
  if(vs.length<=1)dmDrop(id);apply(true);renderPanel();
}
async function remove(id){
  const r=R.get(id);
  try{await writeRow(r,[],r.base)}catch(e){return em(errMsg(e))}
  sel.delete(id);dmDrop(id);editing=null;apply(true);renderPanel();
}
function tbClick(e){
  if(e.target.id==='edmod'){editing=null;renderTable();return}

  if(d.ed!==undefined){editing=+d.ed;renderTable()}
  else if(d.cx){editing=null;renderTable()}
  else if(d.wa!==undefined)addSel(+d.wa);
  else if(d.sv!==undefined)save(+d.sv);
  else if(d.rv!==undefined)remove(+d.rv);
  else if(d.dt!==undefined)delStage(d.dt);
}

let dmOpen=false,dmBelum='',dmPem='',dmQ='',dmAsk=null,dmTab='in';
function dmOk(r){return (!dmPem||r.pem===dmPem)&&(!dmBelum||dmTab==='out'||(dmBelum==='belum')!==isSent(r))&&dmQ.toLowerCase().split(/\s+/).filter(Boolean).every(t=>r.hay.includes(t))}
let dmNew=new Map(),dmOut=new Map();
function updDc(){const c=$('#dc');if(!c)return;const n=dmEntries('in',true).length;c.textContent=n;c.hidden=!n}
const dmKey=(id,s)=>id+'|'+(s.tgl||'')+'|'+s.jml;
function dmStages(r){const a=vst(r).map(s=>({tgl:s.tgl||'',jml:s.jml,by:s.by||''}));if(r.stg&&r.base>0)a.unshift({tgl:'',jml:r.base,by:''});return a}
function dmK(map,s){if(map.has(s))return s;const n=+s;return map.has(n)?n:null}
function dmUsed(id,tgl,sj){let n=0;dmOut.forEach(v=>{if(v&&typeof v==='object'&&!Array.isArray(v)&&v.id===id&&v.tgl===tgl&&rnd(v.sj==null?v.jml:v.sj)===rnd(sj))n+=v.jml});return rnd(n)}
function dmEntries(tab,all){
  const res=[],seen=new Set();
  (tab==='out'?dmOut:dmNew).forEach((v,k)=>{
    if(typeof k==='number'){
      const spec=tab==='out'?v[0]:v,r=R.get(k);
      if(!r||r.jml===null||r.spec!==spec)return;
      if(tab==='out'){res.push({key:k,r,tgl:r.dtg||'',jml:r.cur,out:v[1],whole:true});return}
      dmStages(r).forEach(s=>{const key=dmKey(r.id,s),rem=rnd(s.jml-dmUsed(r.id,s.tgl,s.jml));if(rem<=1e-9||seen.has(key))return;seen.add(key);res.push({key,r,tgl:s.tgl,jml:rem,sj:s.jml,by:s.by})});
      return;
    }
    const r=R.get(v.id);
    if(!r||r.jml===null||r.spec!==v.spec)return;
    if(tab==='out'){res.push({key:k,r,tgl:v.tgl,jml:v.jml,sj:v.sj==null?v.jml:v.sj,by:v.by,out:v.out,spk:v.spk||''});return}
    if(!dmStages(r).some(s=>s.tgl===v.tgl&&s.jml===v.jml)||seen.has(k))return;
    const rem=rnd(v.jml-dmUsed(v.id,v.tgl,v.jml));if(rem<=1e-9)return;
    seen.add(k);res.push({key:k,r,tgl:v.tgl,jml:rem,sj:v.jml,by:v.by});
  });
  const first=new Map();res.forEach((e,i)=>{if(!first.has(e.r.id))first.set(e.r.id,i)});
  res.sort((a,b)=>first.get(a.r.id)-first.get(b.r.id)||(a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0));
  return all?res:res.filter(e=>dmOk(e.r));
}

function dmCard(e,i){
  const r=e.r,o=e.out?e.out:null;
  const sj=e.sj==null?e.jml:e.sj,part=sj-e.jml>1e-9,st=dmStages(r),ix=st.findIndex(s=>s.tgl===e.tgl&&s.jml===sj);

  return `<div class="dmc${o?' out':''}"><div class="dmh"><span class="dmnm">${i+1}. ${esc(r.spec)}</span></div>`+
  `<div class="dmk"><div><small>${o?'Jumlah dikeluarkan':part?'Sisa di daftar':'Jumlah datang'}</small><strong>${esc(rnd(e.jml))} ${esc(r.sat)}</strong>${!o&&part?`<small style="margin-top:8px">Sudah dikeluarkan</small><strong>${esc(rnd(sj-e.jml))} ${esc(r.sat)}</strong>`:''}${o?`<small style="margin-top:8px">No. SPK</small><strong>${esc(e.spk||r.spk)||'-'}</strong>`:''}</div><div><small>Tanggal datang</small><strong>${esc(fmtD(e.tgl))||'-'}</strong>${o?'':`<small style="margin-top:8px">No. SPK</small><strong>${esc(r.spk)||'-'}</strong>`}${o?`<small style="margin-top:8px">Tanggal dikeluarkan</small><strong>${esc(fmtD(o))}</strong>`:''}</div></div>`+
  (r.ket?`<div class="dmket"><small>Keterangan</small><strong>${esc(r.ket)}</strong></div>`:'')+
  (o?`<div class="dmx">${tp}<span class="b ${r.st}">${DMST[r.st]}</span>${dari?`<span>${dari}</span>`:''}${sisa?`<span>${sisa}</span>`:''}</div>`:'')+
  `<div class="dmb">${o?`<button class="sm" data-back="${esc(e.key)}">Kembalikan ke daftar</button>`:`${dmWa(r)}<button class="sm primary" data-out="${esc(e.key)}">Keluarkan barang</button>`}</div></div>`;

function renderDm(){

  if(!list.length)h+=(dmQ||dmPem||(dmBelum&&dmTab==='in'))&&dmEntries(dmTab,true).length?'<div class="note">Tidak ada barang yang cocok dengan pencarian.</div>':dmTab==='out'?'<div class="note">Belum ada barang yang dikeluarkan.</div>':'<div class="note">Daftar masih kosong. Barang yang baru Anda input akan muncul di sini.</div>';
  Object.entries(g).forEach(([pem,a])=>{

{const a=renderTable;renderTable=function(){a.apply(this,arguments);syncHist()};

const NT_APP='bgn',NT_LBL='SIP Bangunan',NT_PUB='BIfmBSe5xsdy6SCUtIKRH30nIp4FZpMtwHXIMOup7H_xH261QCSSF-ajHmbvk2xTZfXF956YZlbhbeDUEmKhLtc',NT_FN=SB_URL+'/functions/v1/push';
const ntB64=s=>{const r=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),a=atob(r);return Uint8Array.from(a,c=>c.charCodeAt(0))};
const ntOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function ntCall(b){const r=await fetch(NT_FN,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({app:NT_APP,tok},b))});return r.json().catch(()=>({}))}
async function ntReg(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;return reg}
async function ntSub(){
  const reg=await ntReg();let s=await reg.pushManager.getSubscription();
  if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ntB64(NT_PUB)});

}
function ntInit(){
  if(!ntOk())return;
  const go=()=>ntSub().catch(()=>{});

  if(Notification.permission==='default'){
    const ask=async()=>{
      document.removeEventListener('click',ask,true);document.removeEventListener('touchend',ask,true);
      try{if(await Notification.requestPermission()==='granted')go()}catch(x){}
    };
    document.addEventListener('click',ask,true);document.addEventListener('touchend',ask,true);

}
function ntSend(title,body){
