  const [it,ks]=await Promise.all([sb('b_sip_item?select=id,tgl,no_sip,spesifikasi,qty,sat,no_spk,keterangan,pemesan&id=eq.'+id),sb('b_kedatangan?select=id,item_id,tgl,jumlah,oleh,masuk_daftar&item_id=eq.'+id+'&order=id')]);
  const own=new Set(ks.map(k=>k.id)),ms=ks.length?await sb('b_material_keluar?select=id,kedatangan_id,jumlah,tgl_keluar,oleh,spk_tujuan&kedatangan_id=in.('+[...own].join(',')+')&order=id'):[];
  allKed=allKed.filter(k=>k.item_id!==id).concat(ks);
  const old=new Set(allKed.map(k=>k.id));allMk=allMk.filter(m=>old.has(m.kedatangan_id)&&!own.has(m.kedatangan_id)).concat(ms);
  if(it[0]){const o=mk(it[0],ks),i=rows.findIndex(r=>r.row===id);if(i>=0)rows[i]=o;R.set(id,o)}
  dmBuild();
}

const ser=s=>Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8))-Date.UTC(1899,11,30))/864e5);
async function writeRow(r,stages){
  const cur=await sb('b_kedatangan?select=id,tgl,jumlah&item_id=eq.'+r.id+'&order=id'),have=r.stg||[];
  if(cur.length!==have.length||cur.some(c=>!have.find(h=>h.id===c.id&&Math.abs(h.jml-Number(c.jumlah))<1e-9&&(h.tgl||'')===(c.tgl||'')))){refresh();throw{code:'conflict'}}
  const keep=new Set(stages.filter(x=>x.id).map(x=>x.id)),del=have.filter(h=>!keep.has(h.id)),add=stages.filter(x=>!x.id);
  const chg=stages.filter(x=>x.id&&have.find(h=>h.id===x.id&&((h.tgl||'')!==(x.tgl||'')||Math.abs(h.jml-x.jml)>1e-9)));
  if(del.length)await sb('b_kedatangan?id=in.('+del.map(d=>d.id).join(',')+')',{m:'DELETE'});
  for(const c of chg)await sb('b_kedatangan?id=eq.'+c.id,{m:'PATCH',b:{tgl:c.tgl||null,jumlah:c.jml}});
  if(add.length)await sb('b_kedatangan',{m:'POST',b:add.map(x=>({item_id:r.id,tgl:x.tgl||null,jumlah:x.jml,oleh:x.by||me||null}))});
  await refreshRow(r.id);lastRev=await getRev();
}
function addSel(id,quiet){

const em=t=>{const m=$('#e-m');if(m)m.textContent=t};
async function save(id){
  const r=R.get(id),tgl=$('#e-t').value,add=num2($('#e-j').value);
  if(!isoRe.test(tgl))return em('Isi tanggal datang.');
  if(add===null||add<=0)return em('Isi jumlah datang lebih dari 0.');
  if(r.qty!==null&&r.cur+add>r.qty+1e-9)return em('Jumlah datang melebihi pesanan di tabel. Maksimal '+rnd(r.qty-r.cur)+' '+r.sat+'.');
  let st0=r.stg||[],base=r.base;if(!r.stg&&r.cur>0&&isoRe.test(r.dtg||'')){st0=[{tgl:r.dtg,jml:r.cur}];base=0}
  const stages=st0.concat({tgl,jml:add,by:me}).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
  $('#e-m').textContent='Menyimpan...';
  try{await writeRow(r,stages,base)}catch(e){return em(errMsg(e))}
  editing=null;ntSend('Barang masuk',`${r.spec}: ${add} ${r.sat}${r.spk?' (SPK '+r.spk+')':''} - oleh ${me}`);dmAdd(id,tgl,add);apply(true);addSel(id,true);
}
const num2=v=>(v===''||isNaN(Number(v)))?null:Number(v);
async function editStage(k,btn){
  const [id,i]=k.split(':').map(Number),r=R.get(id);if(!r)return;
  const vs=vst(r),base=r.stg?r.base:0,row=btn.closest('.st');
  const tgl=row.querySelector('.s-t').value,j=num2(row.querySelector('.s-j').value);
  if(!isoRe.test(tgl))return em('Isi tanggal datang.');
  if(j===null||j<=0)return em('Isi jumlah datang lebih dari 0.');
  const ns=vs.map((s,x)=>x===i?{id:s.id,tgl,jml:j,by:s.by||''}:s).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
  const tot=rnd(base+ns.reduce((s,x)=>s+x.jml,0));
  if(r.qty!==null&&tot>r.qty+1e-9)return em('Total datang melebihi pesanan di tabel. Maksimal tahap ini '+rnd(r.qty-(tot-j))+' '+r.sat+'.');
  em('Menyimpan...');
  try{await writeRow(r,ns,base)}catch(e){return em(errMsg(e))}
  editing=null;apply(true);renderPanel();
}
async function delStage(k){
  const [id,i]=k.split(':').map(Number),r=R.get(id);if(!r)return;const vs=vst(r);if(!vs.length)return;
  try{await writeRow(r,vs.filter((_,x)=>x!==i),r.stg?r.base:0)}catch(e){return em(errMsg(e))}
  if(vs.length<=1)dmDrop(id);apply(true);renderPanel();
}
async function remove(id){
  const r=R.get(id);
  try{await writeRow(r,[],r.base)}catch(e){return em(errMsg(e))}
  sel.delete(id);dmDrop(id);editing=null;apply(true);renderPanel();
}
function tbClick(e){
  if(e.target.id==='edmod'){editing=null;renderTable();return}
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.ed!==undefined){editing=+d.ed;renderTable()}
  else if(d.cx){editing=null;renderTable()}
  else if(d.wa!==undefined)addSel(+d.wa);
  else if(d.sv!==undefined)save(+d.sv);
  else if(d.rv!==undefined)remove(+d.rv);
  else if(d.dt!==undefined)delStage(d.dt);
}

/* Daftar material/barang di gudang: setiap tahap datang ditampilkan terpisah */
let dmOpen=false,dmBelum='',dmPem='',dmQ='',dmAsk=null,dmTab='in';
function dmOk(r){return (!dmPem||r.pem===dmPem)&&(!dmBelum||dmTab==='out'||(dmBelum==='belum')!==isSent(r))&&dmQ.toLowerCase().split(/\s+/).filter(Boolean).every(t=>r.hay.includes(t))}
let dmNew=new Map(),dmOut=new Map();
function updDc(){const c=$('#dc');if(!c)return;const n=dmEntries('in',true).length;c.textContent=n;c.hidden=!n}
const dmKey=(id,s)=>id+'|'+(s.tgl||'')+'|'+s.jml;
function dmStages(r){const a=vst(r).map(s=>({tgl:s.tgl||'',jml:s.jml,by:s.by||''}));if(r.stg&&r.base>0)a.unshift({tgl:'',jml:r.base,by:''});return a}
function dmK(map,s){if(map.has(s))return s;const n=+s;return map.has(n)?n:null}
function dmUsed(id,tgl,sj){let n=0;dmOut.forEach(v=>{if(v&&typeof v==='object'&&!Array.isArray(v)&&v.id===id&&v.tgl===tgl&&rnd(v.sj==null?v.jml:v.sj)===rnd(sj))n+=v.jml});return rnd(n)}
function dmEntries(tab,all){
  const res=[],seen=new Set();
  (tab==='out'?dmOut:dmNew).forEach((v,k)=>{
    if(typeof k==='number'){
      const spec=tab==='out'?v[0]:v,r=R.get(k);
      if(!r||r.jml===null||r.spec!==spec)return;
      if(tab==='out'){res.push({key:k,r,tgl:r.dtg||'',jml:r.cur,out:v[1],whole:true});return}
      dmStages(r).forEach(s=>{const key=dmKey(r.id,s),rem=rnd(s.jml-dmUsed(r.id,s.tgl,s.jml));if(rem<=1e-9||seen.has(key))return;seen.add(key);res.push({key,r,tgl:s.tgl,jml:rem,sj:s.jml,by:s.by})});
      return;
    }
    const r=R.get(v.id);
    if(!r||r.jml===null||r.spec!==v.spec)return;
    if(tab==='out'){res.push({key:k,r,tgl:v.tgl,jml:v.jml,sj:v.sj==null?v.jml:v.sj,by:v.by,out:v.out,spk:v.spk||''});return}
    if(!dmStages(r).some(s=>s.tgl===v.tgl&&s.jml===v.jml)||seen.has(k))return;
    const rem=rnd(v.jml-dmUsed(v.id,v.tgl,v.jml));if(rem<=1e-9)return;
    seen.add(k);res.push({key:k,r,tgl:v.tgl,jml:rem,sj:v.jml,by:v.by});
  });
  const first=new Map();res.forEach((e,i)=>{if(!first.has(e.r.id))first.set(e.r.id,i)});
  res.sort((a,b)=>first.get(a.r.id)-first.get(b.r.id)||(a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0));
  return all?res:res.filter(e=>dmOk(e.r));
}
const isStk=s=>/stock|stok/i.test(s||'');
const dmSpkList=()=>[...new Set(rows.map(r=>r.spk).filter(x=>x&&!isStk(x)))].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
async function dmKeluar(key,tgl,qty,spk){
  const e=dmEntries('in',true).find(x=>x.key===key),v=dmNew.get(key);if(!e||!v)return;
  const q=rnd(qty==null?e.jml:qty);if(!(q>0)||q>e.jml+1e-9)return;
  try{await sb('b_material_keluar',{m:'POST',b:{kedatangan_id:v.kid,jumlah:Math.min(q,e.jml),tgl_keluar:tgl||todayIso(),oleh:me||null,spk_tujuan:spk||null}});await refreshRow(e.r.id);lastRev=await getRev()}
  catch(x){const m=$('#dmte');if(m)m.textContent=errMsg(x);return}
  ntSend('Barang keluar',`${e.r.spec}: ${q} ${e.r.sat}${spk?' ke SPK '+spk:(e.r.spk?' (SPK '+e.r.spk+')':'')} - oleh ${me}`);
  dmAsk=null;updDc();renderDm();
}
async function dmBalik(s){
  const k=dmK(dmOut,s);if(k===null)return;const v=dmOut.get(k);
  try{await sb('b_material_keluar?id=eq.'+v.mid,{m:'DELETE'});await refreshRow(v.id);lastRev=await getRev()}
  catch(x){$('#msg').textContent=errMsg(x);return}
  updDc();renderDm();
}
function dmAdd(){updDc();if(dmOpen)renderDm()}
function dmDrop(){updDc();if(dmOpen)renderDm()}
const dmCnt=tab=>dmEntries(tab).length;
const DMST={belum:'Belum datang',sebagian:'Datang sebagian',selesai:'Sudah lengkap'};
function dmWa(r){
  if(r.jml===null)return '';
  return isSent(r)?`<button class="sm wasent" data-wa="${r.id}" title="Dikirim oleh ${esc((waSent.get(r.id)||{}).by||'')}">Pesan WA sudah dikirim</button>`:`<button class="sm wa" data-wa="${r.id}">Kirim WA</button>`;
}
const _rp=renderPanel;renderPanel=function(){_rp();if(dmOpen)renderDm()};
function dmCard(e,i){
  const r=e.r,o=e.out?e.out:null;
  const sj=e.sj==null?e.jml:e.sj,part=sj-e.jml>1e-9,st=dmStages(r),ix=st.findIndex(s=>s.tgl===e.tgl&&s.jml===sj);
  const tp=!e.whole&&st.length>1&&ix>=0?`<span class="b dmtp">Tahap ${ix+1} dari ${st.length}</span>`:'';
  const sisa=r.st==='sebagian'&&r.sisa>0?`Sisa belum datang: ${esc(rnd(r.sisa))} ${esc(r.sat)}`:'';
  const dari=r.qtyS?`Jumlah pesanan: ${esc(r.qtyS)} ${esc(r.sat)}`:'';
  const kel=o?'':(part?`Datang ${esc(rnd(sj))}, sudah dikeluarkan ${esc(rnd(sj-e.jml))} ${esc(r.sat)}`:'');
  return `<div class="dmc${o?' out':''}"><div class="dmh"><span class="dmnm">${i+1}. ${esc(r.spec)}</span></div>`+
  `<div class="dmk"><div><small>${o?'Jumlah dikeluarkan':part?'Sisa di daftar':'Jumlah datang'}</small><strong>${esc(rnd(e.jml))} ${esc(r.sat)}</strong>${!o&&part?`<small style="margin-top:8px">Sudah dikeluarkan</small><strong>${esc(rnd(sj-e.jml))} ${esc(r.sat)}</strong>`:''}${o?`<small style="margin-top:8px">No. SPK</small><strong>${esc(e.spk||r.spk)||'-'}</strong>`:''}</div><div><small>Tanggal datang</small><strong>${esc(fmtD(e.tgl))||'-'}</strong>${o?'':`<small style="margin-top:8px">No. SPK</small><strong>${esc(r.spk)||'-'}</strong>`}${o?`<small style="margin-top:8px">Tanggal dikeluarkan</small><strong>${esc(fmtD(o))}</strong>`:''}</div></div>`+
  (o?`<div class="dmx">${tp}<span class="b ${r.st}">${DMST[r.st]}</span>${dari?`<span>${dari}</span>`:''}${sisa?`<span>${sisa}</span>`:''}</div>`:'')+
  `<div class="dmb">${o?`<button class="sm" data-back="${esc(e.key)}">Kembalikan ke daftar</button>`:`${dmWa(r)}<button class="sm primary" data-out="${esc(e.key)}">Keluarkan barang</button>`}</div></div>`;
}
function renderDm(){
  const p=$('#dmp');updDc();$('#dm').setAttribute('aria-pressed',String(dmOpen));
  document.body.style.overflow=(dmOpen||panelOpen||!pk.hidden)?'hidden':'';
  if(!dmOpen){p.hidden=true;return}
  p.hidden=false;
  const names=[...new Set([...dmEntries('in',true),...dmEntries('out',true)].map(e=>e.r.pem).filter(Boolean))].sort();
  const list=dmEntries(dmTab),g={};
  list.forEach(e=>(g[e.r.pem||'Tanpa pemesan']=g[e.r.pem||'Tanpa pemesan']||[]).push(e));
  let h=`<div class="ph"><b>${dmTab==='out'?'Barang dikeluarkan':'Daftar material/barang di gudang'}</b><span>${list.length} barang</span><button class="sm" id="dmcl" style="margin-left:auto">Tutup</button></div>`;
  h+=`<div class="dmf"><input id="dmq" type="search" placeholder="Cari barang, no. SPK, atau pengawas" value="${esc(dmQ)}" aria-label="Cari"></div>`;
  h+=`<div class="dmf"><select id="dmsel" aria-label="Pemesan"><option value="">Semua pemesan</option>${names.map(n=>`<option${n===dmPem?' selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  if(dmTab==='in'){const w=dmEntries('in',true).filter(e=>e.r.jml!==null),nb=w.filter(e=>!isSent(e.r)).length,ns=w.length-nb;h+=`<div class="dmf"><select id="dmwa" aria-label="Status WA"><option value="">Semua status WA</option><option value="belum"${dmBelum==='belum'?' selected':''}>WA belum dikirim (${nb})</option><option value="sudah"${dmBelum==='sudah'?' selected':''}>WA sudah dikirim (${ns})</option></select></div>`}
  h+=`<div class="dmtabs"><button class="${dmTab==='in'?'on':''}" data-tab="in">Daftar material/barang di gudang (${dmCnt('in')})</button><button class="${dmTab==='out'?'on':''}" data-tab="out">Barang dikeluarkan (${dmCnt('out')})</button></div>`;
  if(!list.length)h+=(dmQ||dmPem||(dmBelum&&dmTab==='in'))&&dmEntries(dmTab,true).length?'<div class="note">Tidak ada barang yang cocok dengan pencarian.</div>':dmTab==='out'?'<div class="note">Belum ada barang yang dikeluarkan.</div>':'<div class="note">Daftar masih kosong. Barang yang baru Anda input akan muncul di sini.</div>';
  Object.entries(g).forEach(([pem,a])=>{
    h+=`<div class="grp"><div class="gh"><h3>Pemesan: ${esc(pem)}</h3><span class="note">${a.length} barang</span></div>`+
    a.map(dmCard).join('')+'</div>';
  });
  if(dmAsk!==null){const ae=dmEntries('in',true).find(x=>x.key===dmAsk);h+=`<div class="dmmod" id="dmmod" role="dialog" aria-modal="true" aria-labelledby="dmmt"><div class="dmbox"><h3 id="dmmt">Keluarkan barang</h3>${ae?`<div class="dmnm">${esc(ae.r.spec)}</div><div class="note">Jumlah ${esc(rnd(ae.jml))} ${esc(ae.r.sat)}${ae.tgl?', datang tgl '+esc(fmtD(ae.tgl)):''}</div>`:''}<label>Jumlah dikeluarkan (${esc(ae.r.sat)}, maks ${esc(rnd(ae.jml))})<input type="number" id="dmjl" min="0" max="${esc(ae.jml)}" step="any" inputmode="decimal" value="${esc(rnd(ae.jml))}"></label>${isStk(ae.r.spk)?`<label>Pilih SPK tujuan<select id="dmspk" style="width:100%;font-size:16px;padding:12px"><option value="">Pilih no. SPK</option>${dmSpkList().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`:''}<label>Tanggal dikeluarkan (ketuk untuk memilih dari kalender)<input type="date" id="dmtg" value="${todayIso()}"></label><div class="note" id="dmte" style="color:var(--warn)"></div><div class="dmbb"><button class="sm primary" data-ok="${esc(dmAsk)}">Simpan</button><button class="sm" data-no="1">Batal</button></div></div></div>`}
  p.innerHTML=h;
  if(dmAsk!==null){const i=$('#dmjl')||$('#dmtg');if(i){i.focus();try{i.select()}catch(x){}}}
}
$('#dm').onclick=()=>{dmOpen=!dmOpen;renderDm()};
$('#dmp').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='dmcl'){dmOpen=false;renderDm()}
  else if(t.dataset.tab){dmTab=t.dataset.tab;dmAsk=null;renderDm()}
  else if(t.dataset.out!==undefined){dmAsk=t.dataset.out;renderDm()}
  else if(t.dataset.no){dmAsk=null;renderDm()}
  else if(t.id==='dmmod'){dmAsk=null;renderDm()}
  else if(t.dataset.ok!==undefined){const ae=dmEntries('in',true).find(x=>x.key===t.dataset.ok),qv=num2(($('#dmjl')||{}).value),mm=$('#dmte');
    if(ae&&(qv===null||qv<=0)){if(mm)mm.textContent='Isi jumlah dikeluarkan lebih dari 0.';const j=$('#dmjl');if(j)j.focus();return}
    if(ae&&qv>ae.jml+1e-9){if(mm)mm.textContent='Jumlah melebihi yang ada. Maksimal '+rnd(ae.jml)+' '+ae.r.sat+'.';const j=$('#dmjl');if(j)j.focus();return}
    let spk='';if(ae&&isStk(ae.r.spk)){const sv=(($('#dmspk')||{}).value||'').trim();if(!sv||!dmSpkList().includes(sv)){if(mm)mm.textContent='Pilih SPK tujuan dari daftar.';const k=$('#dmspk');if(k)k.focus();return}spk=sv}
    const v=($('#dmtg')||{}).value,iso=isoRe.test(v||'')?v:'';if(!iso){const m=$('#dmte');if(m)m.textContent='Pilih tanggal dulu dari kalender.';const i=$('#dmtg');if(i)i.focus();return}dmKeluar(t.dataset.ok,iso,qv,spk)}
  else if(t.dataset.back!==undefined)dmBalik(t.dataset.back);
  else if(t.dataset.wa!==undefined)addSel(+t.dataset.wa)
});
$('#dmp').addEventListener('change',e=>{if(e.target.id==='dmsel'){dmPem=e.target.value;dmAsk=null;renderDm()}else if(e.target.id==='dmwa'){dmBelum=e.target.value;dmAsk=null;renderDm()}});
$('#dmp').addEventListener('input',e=>{if(e.target.id==='dmq'){dmQ=e.target.value;dmAsk=null;renderDm();const q=$('#dmq');if(q){q.focus();const n=q.value.length;try{q.setSelectionRange(n,n)}catch(x){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dmOpen&&pk.hidden){if(dmAsk!==null)dmAsk=null;else dmOpen=false;renderDm()}});

/* Tombol back HP: menutup lapisan teratas (popup/panel), tidak langsung keluar halaman */
let hd=0,hSkip=false;
const ovN=()=>(dmOpen?1:0)+(dmAsk!==null?1:0)+(panelOpen?1:0)+(editing!==null?1:0);
function syncHist(){const n=ovN();while(hd<n){history.pushState({ov:++hd},'')}if(hd>n){const d=hd-n;hd=n;hSkip=true;history.go(-d)}}
{const a=renderTable;renderTable=function(){a.apply(this,arguments);syncHist()};
const b=renderDm;renderDm=function(){b.apply(this,arguments);syncHist()};
const c=renderPanel;renderPanel=function(){c.apply(this,arguments);syncHist()}}
window.addEventListener('popstate',()=>{
  if(hSkip){hSkip=false;return}
  hd=Math.max(0,hd-1);
  if(editing!==null){editing=null;renderTable()}
  else if(panelOpen){panelOpen=false;renderPanel()}
  else if(dmAsk!==null){dmAsk=null;renderDm()}
  else if(dmOpen){dmOpen=false;renderDm()}
  syncHist();
});

/* Notifikasi push: kirim ke HP lain saat ada barang masuk / keluar */
const NT_APP='bgn',NT_LBL='SIP Bangunan',NT_PUB='BIfmBSe5xsdy6SCUtIKRH30nIp4FZpMtwHXIMOup7H_xH261QCSSF-ajHmbvk2xTZfXF956YZlbhbeDUEmKhLtc',NT_FN=SB_URL+'/functions/v1/push';
const ntB64=s=>{const r=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),a=atob(r);return Uint8Array.from(a,c=>c.charCodeAt(0))};
const ntOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function ntCall(b){const r=await fetch(NT_FN,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({app:NT_APP,tok},b))});return r.json().catch(()=>({}))}
async function ntReg(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;return reg}
async function ntSub(){
  const reg=await ntReg();let s=await reg.pushManager.getSubscription();
  if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ntB64(NT_PUB)});
  await ntCall({action:'subscribe',sub:s.toJSON()});
  try{localStorage.setItem('nt2','1')}catch(x){}
}
function ntInit(){
  if(!ntOk())return;
  const go=()=>ntSub().catch(()=>{});
  if(Notification.permission==='granted'){go();return}
  if(Notification.permission==='default'){
    const ask=async()=>{
      document.removeEventListener('click',ask,true);document.removeEventListener('touchend',ask,true);
      try{if(await Notification.requestPermission()==='granted')go()}catch(x){}
    };
    document.addEventListener('click',ask,true);document.addEventListener('touchend',ask,true);
  }
}
function ntSend(title,body){
  if(!tok||!ntOk())return;
  (async()=>{try{const reg=await navigator.serviceWorker.getRegistration(),s=reg&&await reg.pushManager.getSubscription();
    await ntCall({action:'notify',own:s?s.endpoint:'',title:title+' - '+NT_LBL,body})}catch(x){}})();
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='dmtg'||e.target.id==='dmjl')){const b=document.querySelector('#dmmod [data-ok]');if(b)b.click()}});
